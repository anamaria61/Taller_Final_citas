<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Barbería - Citas SENA</title>
  <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
  <header>
    <h1>Dashboard de Citas y Servicios</h1>
    <p>Procesamiento de información con JavaScript</p>
  </header>

  <main>
    <section id="resumen" class="resumen"></section>

    <section>
      <h2>Servicios Registrados</h2>
      <div id="servicios"></div>
    </section>

    <section>
      <h2>Resumen por Estado de Citas</h2>
      <div id="tabla-estados"></div>
    </section>

    <section>
      <h2>Meses Activos</h2>
      <div id="tabla-meses"></div>
    </section>

    <section>
      <h2>Detalle General de Citas</h2>
      <div id="tabla-citas"></div>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
